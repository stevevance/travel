<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
<title>The Hague day, by tram, metro and train</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="map-common.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="map-common.js"></script>
</head>
<body>
<div id="map"></div>
<div class="panel" id="panel">
  <p class="backlink"><a href="./">&larr; All travel plans</a></p>
  <p class="kicker">Saturday, 12 September 2026 &middot; a day out from Rotterdam</p>
  <h1>The Hague, Delft and back</h1>
  <div class="legend">
    <div class="lg"><span class="sw metro"></span> Metro E (RandstadRail)</div>
    <div class="lg"><span class="sw tram"></span> Tram 9, 1 and 8</div>
    <div class="lg"><span class="sw train"></span> NS Intercity</div>
    <div class="lg"><span class="sw walk"></span> On foot</div>
  </div>
  <p class="iconnote">Icons say what each stop was for; faded glyphs are transit
     stops we only passed through. Click any step to fly there.</p>
  <ol id="key"></ol>
</div>
<script>
const LINES = __LINES__;
const STOPS = __STOPS__;

/* What each stop was for, keyed the same way as STOPS. */
const STOP_ICON = {
  meijersplein:'train', denhaag_cs:'train', bierkade:'ship',   kerkplein:'church',
  ov_museum:'museum',   kurhaus:'landmark', summertime:'drinks', malieveld:'park',
  koekamp:'deer',       binnenhof:'castle', grote_markt:'shops', prinsenhof:'museum',
  lakila:'food',        delft_station:'train', rotterdam_cs:'train', wilgenlei:'tram'
};
/* Changed vehicles here and nothing more. */
const QUIET = ['meijersplein', 'denhaag_cs', 'delft_station', 'rotterdam_cs',
               'wilgenlei'];

MapKit.render({
  lines: LINES, stops: STOPS, stopIcon: STOP_ICON, quiet: QUIET,
  views: {
    denhaag:     {center:[4.3042, 52.0877], zoom:12.15},
    scheveningen:{center:[4.2825, 52.11385], zoom:15.75},
    delft:       {center:[4.3572, 52.0102], zoom:14.30}
  }
});
</script>
</body>
</html>
